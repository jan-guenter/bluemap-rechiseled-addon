name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out add-on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check out exact BlueMap backport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jan-guenter/BlueMap
          ref: 7e07f4e74ec1e92a6ead9aa1e66054af3e133aac
          path: .ci/bluemap
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Acquire exact ephemeral runtime input
        run: |
          input_dir="${RUNNER_TEMP}/rechiseled"
          mkdir -p "${input_dir}"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/rechiseled-1.2.5-neoforge-mc1.21.jar" \
            "https://cdn.modrinth.com/data/B0g2vT6l/versions/S5FnErRw/rechiseled-1.2.5-neoforge-mc1.21.jar"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/fusion-1.3.12-neoforge-mc1.21.1.jar" \
            "https://cdn.modrinth.com/data/p19vrgc2/versions/6Oxgpgr9/fusion-1.3.12-neoforge-mc1.21.1.jar"

      - name: Run the authoritative review gate once
        run: |
          input_dir="${RUNNER_TEMP}/rechiseled"
          python3 gallery/generate.py --check
          python3 -m json.tool provenance/upstreams.json >/dev/null
          python3 -m json.tool provenance/release.json >/dev/null
          (cd gallery && sha256sum --check SHA256SUMS)
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -PrechiseledJar="${input_dir}/rechiseled-1.2.5-neoforge-mc1.21.jar" \
            -PfusionJar="${input_dir}/fusion-1.3.12-neoforge-mc1.21.1.jar" \
            clean prototypeCheck build generatePomFileForAddonPublication \
            generateMetadataFileForAddonPublication
          version="$(sed -n 's/^addon_version=//p' gradle.properties)"
          test -n "${version}"
          test "$(stat -c %s \
            "build/libs/bluemap-rechiseled-addon-${version}.jar")" -eq 650048
          test "$(stat -c %s \
            "build/libs/bluemap-rechiseled-addon-${version}-sources.jar")" \
            -eq 584128
          test "$(stat -c %s build/publications/addon/pom-default.xml)" -eq 1359
          test "$(stat -c %s build/publications/addon/module.json)" -eq 2841
          sha256sum --check <<SHA256SUMS
          95c9e026b4b2826be67b594390c69b1c4d2d5c1036152fa5a36271a82a66ff33  build/libs/bluemap-rechiseled-addon-${version}.jar
          a009811922b22f0a6b8fa43beabe624a4d811ff2208c2bf6be76ae8617c9a258  build/libs/bluemap-rechiseled-addon-${version}-sources.jar
          72120cd6ac5233e7dd2ed49cf003ae462efd85009ef70391b9972ca410b101d9  build/publications/addon/pom-default.xml
          9e4f33e73606964fd2421db2d9ab6149d810fe0383d303f21626230a4da2de73  build/publications/addon/module.json
          SHA256SUMS

      - name: Upload review outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bluemap-rechiseled-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/publications/addon/pom-default.xml
            build/publications/addon/module.json
            build/reports/**
          if-no-files-found: error
          retention-days: 14
