// SPDX-License-Identifier: MIT

plugins {
    id 'java-library'
    id 'checkstyle'
    id 'maven-publish'
    id 'io.github.janguenter.bluemap-addon.java-conventions'
}

group = addon_group
version = addon_version

base {
    archivesName = artifact_id
}

sourceSets {
    main.java.srcDirs(
            'modules/bluemap-addon-adapter-api/src/main/java',
            'modules/bluemap-fusion-resource-models/src/main/java'
    )
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://repo.bluecolored.de/releases')
        content { includeGroupByRegex('de\\.bluecolored.*') }
    }
}

dependencies {
    compileOnly "de.bluecolored:bluemap-core:${bluemap_version}"
    compileOnly 'org.jetbrains:annotations:23.0.0'

    testImplementation "de.bluecolored:bluemap-core:${bluemap_version}"
    testImplementation 'org.jetbrains:annotations:23.0.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(AbstractArchiveTask).configureEach {
    includeEmptyDirs = false
}

// The reviewed integration JAR used javac's source/line debug set for this class.
// Recompile it after Gradle's default pass so the release reproduces those exact bytes.
tasks.named('compileJava', JavaCompile).configure {
    doLast {
        def entrypointSource = layout.projectDirectory.file(
                'src/main/java/io/github/janguenter/bluemap/rechiseled/BlueMapRechiseledAddon.java'
        ).asFile
        def outputDirectory = destinationDirectory.get().asFile
        def compilerArguments = [
                '--release', '21',
                '-encoding', 'UTF-8',
                '-g:source,lines',
                '-cp', classpath.asPath + File.pathSeparator + outputDirectory.absolutePath,
                '-d', outputDirectory.absolutePath,
                entrypointSource.absolutePath
        ] as String[]
        def compiler = javax.tools.ToolProvider.systemJavaCompiler
        if (compiler == null || compiler.run(null, null, null, compilerArguments) != 0) {
            throw new GradleException('Failed to compile the reviewed integration entrypoint')
        }
    }
}

tasks.named('test', Test).configure {
    def rechiseledJar = providers.gradleProperty('rechiseledJar')
    def fusionJar = providers.gradleProperty('fusionJar')
    if (rechiseledJar.isPresent()) {
        systemProperty 'rechiseledJar', rechiseledJar.get()
    }
    if (fusionJar.isPresent()) {
        systemProperty 'fusionJar', fusionJar.get()
    }
}

tasks.named('processResources').configure {
    inputs.property('version', project.version)
    filesMatching('bluemap.addon.json') {
        expand(version: project.version)
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Automatic-Module-Name': 'io.github.janguenter.bluemap.rechiseled',
                'Implementation-Title': addon_name,
                'Implementation-Version': project.version.toString()
        )
    }
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-rechiseled-addon' }
    }
    from('LICENSE-BlueMap') {
        into 'META-INF'
    }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-rechiseled-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-rechiseled-addon.md' }
    }
    from('provenance/upstreams.json') {
        into 'META-INF/bluemap-rechiseled'
    }
}

tasks.named('sourcesJar', Jar).configure {
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-rechiseled-addon' }
    }
    from('LICENSE-BlueMap') {
        into 'META-INF'
    }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-rechiseled-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-rechiseled-addon.md' }
    }
    from('provenance/upstreams.json') {
        into 'META-INF/bluemap-rechiseled'
    }
}

def productionJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def publishedSourcesJar = tasks.named('sourcesJar', Jar).flatMap { it.archiveFile }
def reviewedEntrypointClass =
        'io/github/janguenter/bluemap/rechiseled/BlueMapRechiseledAddon.class'
def reviewedEntrypointClassSha256 =
        'b85a128b6ab1b73f4accdd967c43f3b12a2816894217436f94207a10b2d80bca'
def sharedAdapterApiPackage =
        'io/github/janguenter/bluemap/addon/adapter/api/bluemap523/'
def sharedAdapterApiClasses = [
        'BlueMapRuntimeCompatibility.class',
        'RegistryGuard.class',
        'ResourceExtensionType.class',
        'SyntheticDispatch.class'
].collect { sharedAdapterApiPackage + it }
def sharedAdapterApiSources = [
        'BlueMapRuntimeCompatibility.java',
        'RegistryGuard.java',
        'ResourceExtensionType.java',
        'SyntheticDispatch.java'
].collect { sharedAdapterApiPackage + it }
def sharedFusionPackage = 'io/github/janguenter/bluemap/resource/fusion/model/'
def sharedFusionClasses = [
        "${sharedFusionPackage}AxisVector.class",
        "${sharedFusionPackage}FusionDirection.class",
        "${sharedFusionPackage}FusionTextureLayout.class",
        "${sharedFusionPackage}FusionTextureSelector\$1.class",
        "${sharedFusionPackage}FusionTextureSelector.class",
        "${sharedFusionPackage}TextureOrientation\$1.class",
        "${sharedFusionPackage}TextureOrientation\$Frame.class",
        "${sharedFusionPackage}TextureOrientation.class"
].collect { it.toString() }
def sharedFusionSources = [
        "${sharedFusionPackage}AxisVector.java",
        "${sharedFusionPackage}FusionDirection.java",
        "${sharedFusionPackage}FusionTextureLayout.java",
        "${sharedFusionPackage}FusionTextureSelector.java",
        "${sharedFusionPackage}TextureOrientation.java"
].collect { it.toString() }
def approvedSharedClasses = sharedAdapterApiClasses + sharedFusionClasses
def approvedSharedSources = sharedAdapterApiSources + sharedFusionSources
def legacyLocalAdapterPackage =
        'io/github/janguenter/bluemap/rechiseled/adapter/bluemap522/'
def displacedAdapterHelpers = [
        'io/github/janguenter/bluemap/rechiseled/adapter/bluemap523/AdapterCompatibility',
        'io/github/janguenter/bluemap/rechiseled/adapter/bluemap523/RechiseledResourceExtensionType'
]
def legacyFusionClasses = [
        'io/github/janguenter/bluemap/rechiseled/model/AxisVector.class',
        'io/github/janguenter/bluemap/rechiseled/model/FusionDirection.class',
        'io/github/janguenter/bluemap/rechiseled/model/FusionTextureSelector$1.class',
        'io/github/janguenter/bluemap/rechiseled/model/FusionTextureSelector.class',
        'io/github/janguenter/bluemap/rechiseled/model/TextureOrientation$1.class',
        'io/github/janguenter/bluemap/rechiseled/model/TextureOrientation$Frame.class',
        'io/github/janguenter/bluemap/rechiseled/model/TextureOrientation.class'
]
def legacyFusionSources = [
        'io/github/janguenter/bluemap/rechiseled/model/AxisVector.java',
        'io/github/janguenter/bluemap/rechiseled/model/FusionDirection.java',
        'io/github/janguenter/bluemap/rechiseled/model/FusionTextureSelector.java',
        'io/github/janguenter/bluemap/rechiseled/model/TextureOrientation.java'
]
tasks.register('verifyProductionJar') {
    dependsOn tasks.named('jar')
    inputs.file(productionJar)

    doLast {
        def jarFile = inputs.files.singleFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            def required = [
                    'bluemap.addon.json',
                    reviewedEntrypointClass,
                    'assets/bluemap_rechiseled/blockstates/fusion_model.json',
                    'bluemap-rechiseled/profiles/exact-artifacts.json',
                    'bluemap-rechiseled/profiles/rechiseled/1.2.5-fusion-1.3.12/profile.json',
                    'bluemap-rechiseled/profiles/rechiseled/1.2.5-fusion-1.3.12/definitions.tsv',
                    'bluemap-rechiseled/profiles/rechiseled/1.2.5-fusion-1.3.12/required-resources.tsv',
                    'bluemap-rechiseled/profiles/rechiseled/1.2.5-fusion-1.3.12/textures.tsv',
                    'bluemap-rechiseled/profiles/rechiseled/1.2.5-fusion-1.3.12/host-models.tsv',
                    'META-INF/LICENSE-bluemap-rechiseled-addon',
                    'META-INF/LICENSE-BlueMap',
                    'META-INF/NOTICE-bluemap-rechiseled-addon.md',
                    'META-INF/THIRD_PARTY-bluemap-rechiseled-addon.md',
                    'META-INF/bluemap-rechiseled/upstreams.json'
            ] + approvedSharedClasses
            def missing = required.findAll { !entries.contains(it) }
            def duplicateShared = approvedSharedClasses.findAll { shared ->
                entries.count { it == shared } != 1
            }
            if (!missing.isEmpty() || !duplicateShared.isEmpty()) {
                throw new GradleException(
                        "Production JAR shared boundary mismatch: missing=${missing}, "
                                + "nonUnique=${duplicateShared}"
                )
            }
            def entrypointSha256 = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(zip.getInputStream(zip.getEntry(reviewedEntrypointClass)).bytes)
                    .encodeHex()
                    .toString()
            if (entrypointSha256 != reviewedEntrypointClassSha256) {
                throw new GradleException(
                        "Reviewed entrypoint byte identity mismatch: ${entrypointSha256}"
                )
            }
            def addon = new groovy.json.JsonSlurper().parseText(
                    zip.getInputStream(zip.getEntry('bluemap.addon.json')).getText('UTF-8')
            )
            if (addon.id != addon_id
                    || addon.entrypoint != 'io.github.janguenter.bluemap.rechiseled.BlueMapRechiseledAddon'
                    || addon.version != project.version.toString()
                    || addon.dependencies != []
                    || addon['soft-dependencies'] != []) {
                throw new GradleException('BlueMap add-on metadata mismatch')
            }
            def foreignClasses = entries.findAll {
                it.endsWith('.class')
                        && !it.startsWith('io/github/janguenter/bluemap/rechiseled/')
                        && !approvedSharedClasses.contains(it)
            }
            def forbidden = entries.findAll {
                it.endsWith('.jar')
                        || it == 'META-INF/neoforge.mods.toml'
                        || it == 'fabric.mod.json'
                        || it.endsWith('.mixins.json')
                        || it.startsWith('assets/rechiseled/')
                        || it.startsWith('assets/fusion/')
                        || (it.startsWith('assets/')
                        && !it.startsWith('assets/bluemap_rechiseled/'))
                        || it.startsWith('com/supermartijn642/')
                        || it.startsWith('earth/terrarium/')
                        || it.startsWith('de/bluecolored/')
                        || it.startsWith('de/maxhenkel/')
                        || it.startsWith('net/minecraft/')
                        || it.startsWith('net/neoforged/')
                        || it.startsWith(legacyLocalAdapterPackage)
                        || displacedAdapterHelpers.any { helper -> it.startsWith(helper) }
                        || legacyFusionClasses.contains(it)
                        || (it.startsWith(sharedAdapterApiPackage)
                        && !sharedAdapterApiClasses.contains(it))
                        || (it.startsWith(sharedFusionPackage)
                        && !sharedFusionClasses.contains(it))
            }
            if (!foreignClasses.isEmpty() || !forbidden.isEmpty()) {
                throw new GradleException(
                        "Production JAR boundary mismatch: foreignClasses=${foreignClasses}, "
                                + "forbidden=${forbidden}"
                )
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('verifySourcesJar') {
    dependsOn tasks.named('sourcesJar')
    inputs.file(publishedSourcesJar)

    doLast {
        def jarFile = inputs.files.singleFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            def required = [
                    'io/github/janguenter/bluemap/rechiseled/BlueMapRechiseledAddon.java',
                    'io/github/janguenter/bluemap/rechiseled/adapter/bluemap523/RechiseledRenderer.java',
                    'bluemap.addon.json',
                    'bluemap-rechiseled/profiles/exact-artifacts.json',
                    'bluemap-rechiseled/profiles/rechiseled/1.2.5-fusion-1.3.12/profile.json',
                    'bluemap-rechiseled/profiles/rechiseled/1.2.5-fusion-1.3.12/definitions.tsv',
                    'bluemap-rechiseled/profiles/rechiseled/1.2.5-fusion-1.3.12/required-resources.tsv',
                    'bluemap-rechiseled/profiles/rechiseled/1.2.5-fusion-1.3.12/textures.tsv',
                    'bluemap-rechiseled/profiles/rechiseled/1.2.5-fusion-1.3.12/host-models.tsv',
                    'META-INF/LICENSE-bluemap-rechiseled-addon',
                    'META-INF/LICENSE-BlueMap',
                    'META-INF/NOTICE-bluemap-rechiseled-addon.md',
                    'META-INF/THIRD_PARTY-bluemap-rechiseled-addon.md',
                    'META-INF/bluemap-rechiseled/upstreams.json'
            ] + approvedSharedSources
            def missing = required.findAll { !entries.contains(it) }
            def duplicateShared = approvedSharedSources.findAll { shared ->
                entries.count { it == shared } != 1
            }
            if (!missing.isEmpty() || !duplicateShared.isEmpty()) {
                throw new GradleException(
                        "Sources JAR shared boundary mismatch: missing=${missing}, "
                                + "nonUnique=${duplicateShared}"
                )
            }
            def projectJava = entries.findAll { it.endsWith('.java') }
            def foreignJava = projectJava.findAll {
                !it.startsWith('io/github/janguenter/bluemap/rechiseled/')
                        && !approvedSharedSources.contains(it)
            }
            def forbidden = entries.findAll {
                it.endsWith('.class')
                        || it.endsWith('.jar')
                        || it.startsWith('assets/rechiseled/')
                        || it.startsWith('assets/fusion/')
                        || (it.startsWith('assets/')
                        && !it.startsWith('assets/bluemap_rechiseled/'))
                        || it.startsWith('com/supermartijn642/')
                        || it.startsWith('earth/terrarium/')
                        || it.startsWith('de/bluecolored/')
                        || it.startsWith('de/maxhenkel/')
                        || it.startsWith('net/minecraft/')
                        || it.startsWith('net/neoforged/')
                        || it.startsWith(legacyLocalAdapterPackage)
                        || displacedAdapterHelpers.any { helper -> it == "${helper}.java" }
                        || legacyFusionSources.contains(it)
                        || (it.startsWith(sharedAdapterApiPackage)
                        && !sharedAdapterApiSources.contains(it))
                        || (it.startsWith(sharedFusionPackage)
                        && !sharedFusionSources.contains(it))
            }
            if (projectJava.isEmpty() || !foreignJava.isEmpty() || !forbidden.isEmpty()) {
                throw new GradleException(
                        "Sources JAR boundary mismatch: foreignJava=${foreignJava}, "
                                + "forbidden=${forbidden}"
                )
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyProductionJar')
    dependsOn tasks.named('verifySourcesJar')
}

tasks.register('verifyPinnedArtifacts', Exec) {
    def rechiseledJar = providers.gradleProperty('rechiseledJar')
    def fusionJar = providers.gradleProperty('fusionJar')
    doFirst {
        if (!rechiseledJar.isPresent() || !fusionJar.isPresent()) {
            throw new GradleException(
                    'Set -PrechiseledJar and -PfusionJar to the exact ATM 1.2.0 artifacts.'
            )
        }
    }
    commandLine 'python3', 'tools/verify_pinned_artifacts.py',
            '--rechiseled', rechiseledJar.getOrElse('missing'),
            '--fusion', fusionJar.getOrElse('missing')
}

tasks.register('prototypeCheck') {
    dependsOn tasks.named('check')
    dependsOn tasks.named('verifyPinnedArtifacts')
}

publishing {
    publications {
        addon(MavenPublication) {
            from components.java
            artifactId = artifact_id
            pom {
                name = addon_name
                description = 'Exact-profile BlueMap rendering for Rechiseled Fusion connected models.'
                url = 'https://github.com/jan-guenter/bluemap-rechiseled-addon'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://spdx.org/licenses/MIT.html'
                        distribution = 'repo'
                    }
                }
                scm {
                    url = 'https://github.com/jan-guenter/bluemap-rechiseled-addon'
                    connection = 'scm:git:https://github.com/jan-guenter/bluemap-rechiseled-addon.git'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/jan-guenter/bluemap-rechiseled-addon')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
